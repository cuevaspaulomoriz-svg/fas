name: Build ROS Loader

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Create loader source
      run: |
        mkdir -p loader
        printf '#include <dlfcn.h>\n#include <android/log.h>\n#define TAG "ROS_LOADER"\n#define LOG(...) __android_log_print(ANDROID_LOG_DEBUG, TAG, __VA_ARGS__)\n__attribute__((constructor))\nvoid load_cheat() {\n    void* h = dlopen("libcheat.so", RTLD_NOW | RTLD_GLOBAL);\n    if (h) LOG("libcheat.so loaded OK");\n    else   LOG("libcheat.so FAILED: %%s", dlerror());\n}\n' > loader/loader.cpp
        printf 'cmake_minimum_required(VERSION 3.18)\nproject(loader)\nadd_library(AudioCCReName SHARED loader.cpp)\ntarget_link_libraries(AudioCCReName android log)\n' > loader/CMakeLists.txt

    - name: Build
      run: |
        cmake -S loader -B loader/build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build loader/build -j4

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: libloader
        path: loader/build/libAudioCCReName.so
        retention-days: 30
