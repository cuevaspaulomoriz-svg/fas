name: Build ROS Loader

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Create loader source
      run: |
        mkdir -p loader
        cat > loader/loader.cpp << 'CPP'
#include <dlfcn.h>
#include <android/log.h>
#define TAG "ROS_LOADER"
#define LOG(...) __android_log_print(ANDROID_LOG_DEBUG, TAG, __VA_ARGS__)
__attribute__((constructor))
void load_cheat() {
    void* h = dlopen("libcheat.so", RTLD_NOW | RTLD_GLOBAL);
    if (h) LOG("libcheat.so loaded OK");
    else   LOG("libcheat.so FAILED: %s", dlerror());
}
CPP
        cat > loader/CMakeLists.txt << 'CMAKE'
cmake_minimum_required(VERSION 3.18)
project(loader)
add_library(AudioCCReName SHARED loader.cpp)
target_link_libraries(AudioCCReName android log)
CMAKE

    - name: Build
      run: |
        cmake -S loader -B loader/build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build loader/build -j4

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: libloader
        path: loader/build/libAudioCCReName.so
        retention-days: 30
