name: Build ROS Loader

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Create loader source
      run: |
        mkdir -p loader
        python3 -c "
        code = r'''
        #include <dlfcn.h>
        #include <android/log.h>
        #include <stdio.h>
        #include <string.h>
        #define TAG \"ROS_LOADER\"
        #define LOG(...) __android_log_print(ANDROID_LOG_DEBUG, TAG, __VA_ARGS__)
        __attribute__((constructor))
        void load_cheat() {
            FILE* f = fopen(\"/proc/self/maps\", \"r\");
            if (!f) return;
            char line[512];
            while (fgets(line, sizeof(line), f)) {
                if (strstr(line, \"libAudioCCReName.so\")) {
                    char* p = strchr(line, '/');
                    if (!p) continue;
                    char* nl = strchr(p, '\n'); if (nl) *nl=0;
                    char* sl = strrchr(p, '/'); if (!sl) continue;
                    *sl = 0;
                    char path[512];
                    snprintf(path, sizeof(path), \"%s/libcheat.so\", p);
                    void* h = dlopen(path, RTLD_NOW|RTLD_GLOBAL);
                    if (h) LOG(\"loaded: %s\", path);
                    else LOG(\"fail: %s\", dlerror());
                    break;
                }
            }
            fclose(f);
        }
        '''.strip()
        open('loader/loader.cpp','w').write(code)
        cmake = 'cmake_minimum_required(VERSION 3.18)\nproject(loader)\nadd_library(AudioCCReName SHARED loader.cpp)\ntarget_link_libraries(AudioCCReName android log)\n'
        open('loader/CMakeLists.txt','w').write(cmake)
        "

    - name: Build
      run: |
        cmake -S loader -B loader/build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build loader/build -j4

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: libloader
        path: loader/build/libAudioCCReName.so
        retention-days: 30
        
