name: Build ROS Cheat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Clone ImGui
      run: |
        git clone --depth 1 https://github.com/ocornut/imgui.git src/imgui

    - name: Configure CMake
      run: |
        cd src
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build src/build --config Release -j4

    - name: Upload libcheat.so
      uses: actions/upload-artifact@v4
      with:
        name: libcheat
        path: src/build/libcheat.so
        retention-days: 30
