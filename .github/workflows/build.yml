name: Build ROS Cheat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Clone ImGui
      run: |
        git clone --depth 1 https://github.com/ocornut/imgui.git src/imgui

    - name: Build Dobby from source (ARM64 Android)
      run: |
        git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/Dobby
        mkdir -p /tmp/Dobby/build_android
        cmake -S /tmp/Dobby -B /tmp/Dobby/build_android \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release \
          -DDOBBY_BUILD_SHARED=OFF \
          -DDOBBY_BUILD_STATIC=ON
        cmake --build /tmp/Dobby/build_android -j4
        mkdir -p src/libs/arm64-v8a src/dobby/include
        cp /tmp/Dobby/build_android/libdobby.a src/libs/arm64-v8a/
        cp /tmp/Dobby/include/dobby.h src/dobby/include/

    - name: Configure CMake
      run: |
        cd src
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build src/build --config Release -j4

    - name: Upload libcheat.so
      uses: actions/upload-artifact@v4
      with:
        name: libcheat
        path: src/build/libcheat.so
        retention-days: 30
